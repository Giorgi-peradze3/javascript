<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>



    <div class="wrapper">
        <form id="loginForm" action="">
            <h1>შესვლა</h1>
            <div class="input-box">
                <input id="userEmail" type="text" placeholder="Username" required>
                <i class="fa-regular fa-user"></i>
            </div>
            <div class="input-box">
                <input id="userPassword"  type="password" placeholder="Password" required>
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="remember">
                <label for=""> <input type="checkbox">პროფილის დამახსოვრება</label>
                <a href="#">პაროლის აღდგენა?</a>
            </div>


            <button class="btn" type="submit">შესვლა</button>

            <div class="register-link">
                <p>არ გაქვს აკაუნტი? <a href="#">დარეგისტრირება</a></p>
            </div>



        </form>

    </div>
    
    <script src="profile.js"></script>
</body>
</html>
